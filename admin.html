<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#061a4b">
<title>Administración RAV</title>
<link rel="icon" type="image/png" href="ravofficial.png">
<link rel="apple-touch-icon" href="ravofficial.png">
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  font-family:Arial,Helvetica,sans-serif;color:#fff;
  background:linear-gradient(145deg,#02152f,#063f92 55%,#0c8fa0);
  padding:24px;
}
.panel{
  width:min(620px,100%);background:rgba(3,28,66,.94);
  border:1px solid rgba(255,255,255,.22);border-radius:24px;
  padding:34px 24px;box-shadow:0 24px 70px rgba(0,0,0,.35);text-align:center;
}
.logo{width:110px;height:110px;object-fit:contain;border-radius:50%;background:#fff;padding:5px}
h1{margin:18px 0 6px;font-size:clamp(26px,5vw,38px)}
.subtitle{margin:0 0 28px;color:#d9eaff}
.menu{display:grid;gap:16px}
a{
  display:block;text-decoration:none;color:#fff;font-weight:800;font-size:20px;
  padding:22px 18px;border-radius:16px;border:1px solid rgba(255,255,255,.22);
  box-shadow:0 10px 24px rgba(0,0,0,.18);transition:.18s transform,.18s filter;
}
a:hover{transform:translateY(-2px);filter:brightness(1.08)}
.events{background:#063f92}
.gallery{background:#0c8fa0}
.small{margin-top:24px;font-size:13px;color:#bcd4f4}
@media(max-width:520px){.panel{padding:28px 16px}.logo{width:92px;height:92px}a{font-size:18px;padding:20px 12px}}
</style>
</head>
<body>
<main class="panel">
  <img class="logo" src="ravofficial.png" alt="RAV">
  <h1>Administración RAV</h1>
  <p class="subtitle">Selecciona el área que deseas administrar</p>
  <div class="menu">
    <a class="events" href="admin-eventos.html">📅 Administrar Eventos</a>
    <a class="gallery" href="admin-galeria.html">📸 Administrar Galería</a>
  </div>
  <div class="small">Ríos de Agua Viva Apostolic Church</div>
</main>
</body>
</html>
