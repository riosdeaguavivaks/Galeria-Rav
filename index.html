<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#061a4b">
<title>Administración RAV</title>
<link rel="icon" type="image/png" href="ravofficial.png">
<link rel="apple-touch-icon" href="ravofficial.png">
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  font-family:Arial,Helvetica,sans-serif;color:#fff;
  background:linear-gradient(145deg,#02152f,#063f92 55%,#0c8fa0);
  padding:24px;
}
.panel{
  width:min(620px,100%);background:rgba(3,28,66,.94);
  border:1px solid rgba(255,255,255,.22);border-radius:24px;
  padding:34px 24px;box-shadow:0 24px 70px rgba(0,0,0,.35);text-align:center;
}
.logo{width:110px;height:110px;object-fit:contain;border-radius:50%;background:#fff;padding:5px}
h1{margin:18px 0 6px;font-size:clamp(26px,5vw,38px)}
.subtitle{margin:0 0 28px;color:#d9eaff}
.login-box{display:grid;gap:14px}
input{
  width:100%;padding:16px;border-radius:12px;border:1px solid rgba(255,255,255,.3);
  font-size:18px;outline:none;
}
button{
  border:0;border-radius:14px;padding:17px 18px;background:#0c8fa0;color:#fff;
  font-size:19px;font-weight:800;cursor:pointer;
}
button:disabled{opacity:.65;cursor:wait}
.error{min-height:20px;color:#ffd0d0;font-weight:700;font-size:14px}
.menu{display:none;gap:16px}
.menu.show{display:grid}
a{
  display:block;text-decoration:none;color:#fff;font-weight:800;font-size:20px;
  padding:22px 18px;border-radius:16px;border:1px solid rgba(255,255,255,.22);
  box-shadow:0 10px 24px rgba(0,0,0,.18);transition:.18s transform,.18s filter;
}
a:hover{transform:translateY(-2px);filter:brightness(1.08)}
.events{background:#063f92}
.gallery{background:#0c8fa0}
.small{margin-top:24px;font-size:13px;color:#bcd4f4}
@media(max-width:520px){
  .panel{padding:28px 16px}.logo{width:92px;height:92px}
  a{font-size:18px;padding:20px 12px}
}
</style>
</head>
<body>
<main class="panel">
  <img class="logo" src="ravofficial.png" alt="RAV">
  <h1>Administración RAV</h1>

  <section id="loginArea">
    <p class="subtitle">🔐 Acceso administrativo</p>
    <div class="login-box">
      <input id="password" type="password" autocomplete="current-password"
             placeholder="Contraseña" aria-label="Contraseña">
      <button id="loginBtn" type="button">ENTRAR</button>
      <div id="error" class="error"></div>
    </div>
  </section>

  <section id="menuArea" class="menu">
    <p class="subtitle">Selecciona el área que deseas administrar</p>
    <a class="events" href="admin-eventos.html">📅 Administrar Eventos</a>
    <a class="gallery" href="admin-galeria.html">📸 Administrar Galería</a>
  </section>

  <div class="small">Ríos de Agua Viva Apostolic Church</div>
</main>

<script>
const RAV_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbwFiDih2S_UUJnhOlX05a-fyjuAACO6V1eicgRROCNBcL0trOr27S9zCqH4FrC7w9x0fw/exec";

const IDLE_LIMIT = 5 * 60 * 1000;

const loginArea = document.getElementById("loginArea");
const menuArea = document.getElementById("menuArea");
const passwordInput = document.getElementById("password");
const loginBtn = document.getElementById("loginBtn");
const errorBox = document.getElementById("error");

let idleTimer = null;

function sessionIsActive(){
  const token = sessionStorage.getItem("ravAdminToken");
  const last = Number(sessionStorage.getItem("ravAdminLastActivity") || 0);

  if(!token || !last) return false;

  if(Date.now() - last > IDLE_LIMIT){
    clearAdminSession();
    return false;
  }

  return true;
}

function clearAdminSession(){
  sessionStorage.removeItem("ravAdminToken");
  sessionStorage.removeItem("ravAdminLastActivity");
  sessionStorage.removeItem("ravAdminUnlocked");
  clearTimeout(idleTimer);
}

function mostrarLogin(message=""){
  clearAdminSession();
  menuArea.classList.remove("show");
  loginArea.style.display = "block";
  passwordInput.value = "";
  errorBox.textContent = message;
}

function mostrarMenu(){
  loginArea.style.display = "none";
  menuArea.classList.add("show");
  touchActivity();
}

function lockForInactivity(){
  mostrarLogin("La sesión se cerró después de 5 minutos sin actividad.");
}

function touchActivity(){
  if(!sessionStorage.getItem("ravAdminToken")) return;

  sessionStorage.setItem("ravAdminLastActivity", String(Date.now()));

  clearTimeout(idleTimer);
  idleTimer = setTimeout(lockForInactivity, IDLE_LIMIT);
}

["click","keydown","touchstart","input"].forEach(eventName => {
  document.addEventListener(eventName, touchActivity, {passive:true});
});

if(sessionIsActive()){
  mostrarMenu();
}else{
  mostrarLogin();
}

async function login(){
  const password = passwordInput.value;

  if (!password) {
    errorBox.textContent = "Escribe la contraseña.";
    return;
  }

  loginBtn.disabled = true;
  loginBtn.textContent = "VERIFICANDO...";
  errorBox.textContent = "";

  try {
    const response = await fetch(RAV_SCRIPT_URL, {
      method: "POST",
      headers: {"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify({
        accion: "adminLogin",
        password: password
      })
    });

    const data = await response.json();

    if (!data.ok || !data.token) {
      throw new Error(data.error || "Contraseña incorrecta.");
    }

    sessionStorage.setItem("ravAdminToken", data.token);
    sessionStorage.setItem("ravAdminUnlocked", "1");
    sessionStorage.setItem("ravAdminLastActivity", String(Date.now()));

    passwordInput.value = "";
    mostrarMenu();

  } catch (error) {
    errorBox.textContent =
      "No se pudo iniciar sesión. Verifica la contraseña e inténtalo nuevamente.";
  } finally {
    loginBtn.disabled = false;
    loginBtn.textContent = "ENTRAR";
  }
}

loginBtn.addEventListener("click", login);

passwordInput.addEventListener("keydown", function(e){
  if (e.key === "Enter") login();
});

window.addEventListener("pageshow", function(){
  if(sessionIsActive()){
    mostrarMenu();
  }
});
</script>
</body>
</html>
